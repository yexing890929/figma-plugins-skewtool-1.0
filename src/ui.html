<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skew Tool</title>
    <style>
      :root { color: #242424; font-family: Inter, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 0 16px 12px; }
      .preview { align-items: center; display: flex; height: 122px; justify-content: center; overflow: hidden; position: relative; }
      .preview::before { background: #f1f1f1; content: ""; height: 1px; left: 0; position: absolute; right: 0; top: 50%; }
      .preview::after { background: #f1f1f1; bottom: 0; content: ""; left: 50%; position: absolute; top: 0; width: 1px; }
      .shape { align-items: center; background: #0eea91; border: 2px solid #4a4a4a; display: flex; height: 58px; justify-content: center; position: relative; transition: transform 120ms ease-out; width: 58px; z-index: 1; }
      .shape::before, .shape::after { background: #4a4a4a; content: ""; height: 2px; position: absolute; width: 16px; }
      .shape::after { transform: rotate(90deg); }
      .anchor-control { align-items: center; display: flex; justify-content: space-between; margin: 7px 0 5px; }
      .anchor-label { align-items: center; color: #777; display: flex; font-size: 11px; font-weight: 500; gap: 8px; }
      .anchor-icon { display: block; height: 12px; width: 12px; }
      .anchor-grid { display: grid; gap: 3px; grid-template-columns: repeat(3, 14px); }
      .anchor-button { background: #fff; border: 1px solid #c9c9c9; border-radius: 2px; height: 14px; padding: 0; width: 14px; }
      .anchor-button:hover { border-color: #777; }
      .anchor-button[aria-checked="true"] { background: #242424; border-color: #242424; }
      .control { margin-top: 12px; position: relative; }
      .control:first-of-type { margin-top: 0; }
      .control-top { align-items: center; display: flex; gap: 6px; justify-content: space-between; margin-bottom: 4px; }
      label { color: #777; font-size: 12px; font-weight: 500; }
      .icon { display: block; height: 12px; width: 12px; }
      .control-name { align-items: center; display: flex; flex: 1; gap: 8px; }
      .number { appearance: textfield; background: transparent; border: 0; border-bottom: 1px solid transparent; color: #777; font: 500 12px Inter, sans-serif; padding: 1px 0; text-align: right; width: 40px; }
      .number:focus { border-bottom: 1.5px solid #000; outline: 0; }
      .number::-webkit-inner-spin-button, .number::-webkit-outer-spin-button { appearance: none; margin: 0; }
      .degree { color: #777; font-size: 12px; margin-left: -4px; }
      input[type="range"] { appearance: none; background: transparent; display: block; height: 12px; margin: 0; width: 100%; }
      input[type="range"]::-webkit-slider-runnable-track { background: #d5d5d9; border-radius: 999px; height: 3px; }
      input[type="range"]::-webkit-slider-thumb { appearance: none; background: #292929; border: 0; border-radius: 50%; height: 12px; margin-top: -4.5px; width: 12px; }
      .number { width: 30px; min-width: 0; }
      .preset-toggle { align-items: center; background: transparent; border: 0; color: #a4a4a4; display: flex; flex: 0 0 16px; height: 20px; justify-content: center; padding: 0; width: 16px; }
      .preset-toggle:hover, .preset-toggle[aria-expanded="true"] { color: #000; }
      .preset-toggle svg { height: 12px; transition: transform 160ms ease; width: 12px; }
      .preset-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
      .preset-toggle:focus-visible { outline: 1px solid #000; outline-offset: 2px; }
      .axis-presets { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; box-shadow: 0 4px 12px #0002; display: none; gap: 4px; grid-template-columns: repeat(3, 1fr); padding: 6px; position: absolute; right: 0; top: 24px; width: 100%; z-index: 10; }
      .control.is-open .axis-presets { display: grid; }
      .axis-preset-button { background: #fff; border: 1px solid #d5d5d9; border-radius: 4px; color: #777; font-size: 10px; height: 24px; padding: 0; }
      .axis-preset-button:hover { border-color: #777; color: #242424; }
      .axis-preset-button.is-active { background: #242424; border-color: #242424; color: #fff; }
      .actions { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-top: 22px; }
      button { border-radius: 8px; cursor: pointer; font: 600 12px Inter, sans-serif; height: 36px; }
      .reset { background: #fff; border: 1.5px solid #333; color: #333; }
      .apply { background: #18a0fb; border: 2px solid #18a0fb; color: #fff; }
      .apply:hover { background: #0d8de3; border-color: #0d8de3; }
      .undo { background: transparent; border: 0; color: #777; font-size: 10px; height: auto; margin-top: 12px; text-decoration: none; width: 100%; }
    </style>
  </head>
  <body>
    <div class="preview" aria-label="斜切效果预览">
      <div id="preview-shape" class="shape"></div>
    </div>
    <div class="anchor-control" role="radiogroup" aria-label="斜切锚点">
      <span class="anchor-label"><svg class="anchor-icon" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="1" y="1" width="2" height="2" fill="#A4A4A4"/><rect x="1" y="5" width="2" height="2" fill="#A4A4A4"/><rect x="1" y="9" width="2" height="2" fill="#A4A4A4"/><rect x="5" y="1" width="2" height="2" fill="#A4A4A4"/><rect x="5" y="5" width="2" height="2" fill="#A4A4A4"/><rect x="5" y="9" width="2" height="2" fill="#A4A4A4"/><rect x="9" y="1" width="2" height="2" fill="#A4A4A4"/><rect x="9" y="5" width="2" height="2" fill="#A4A4A4"/><rect x="9" y="9" width="2" height="2" fill="#A4A4A4"/></svg>Anchor</span>
      <div class="anchor-grid">
        <button class="anchor-button" type="button" data-anchor="top-left" role="radio" aria-label="左上锚点" aria-checked="false"></button>
        <button class="anchor-button" type="button" data-anchor="top-center" role="radio" aria-label="上中锚点" aria-checked="false"></button>
        <button class="anchor-button" type="button" data-anchor="top-right" role="radio" aria-label="右上锚点" aria-checked="false"></button>
        <button class="anchor-button" type="button" data-anchor="center-left" role="radio" aria-label="左中锚点" aria-checked="false"></button>
        <button class="anchor-button" type="button" data-anchor="center" role="radio" aria-label="中心锚点" aria-checked="true"></button>
        <button class="anchor-button" type="button" data-anchor="center-right" role="radio" aria-label="右中锚点" aria-checked="false"></button>
        <button class="anchor-button" type="button" data-anchor="bottom-left" role="radio" aria-label="左下锚点" aria-checked="false"></button>
        <button class="anchor-button" type="button" data-anchor="bottom-center" role="radio" aria-label="下中锚点" aria-checked="false"></button>
        <button class="anchor-button" type="button" data-anchor="bottom-right" role="radio" aria-label="右下锚点" aria-checked="false"></button>
      </div>
    </div>
    <div class="control">
      <div class="control-top">
        <div class="control-name"><svg class="icon" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="1" y="5" width="10" height="2" fill="#A4A4A4"/><path d="M8 1H11V3H6L8 1Z" fill="#A4A4A4"/><path d="M4 11L1 11L1 9L6 9L4 11Z" fill="#A4A4A4"/></svg><label for="horizontal-angle">Horizontal Skew</label></div>
        <input id="horizontal-angle" class="number" type="number" value="0" min="-60" max="60" step="1" aria-label="水平斜切角度" />
        <span class="degree">°</span>
        <button class="preset-toggle" type="button" aria-label="水平角度预设" aria-expanded="false" aria-controls="horizontal-presets"><svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 3.5L6 7.5L10 3.5" stroke-width="1.5" stroke="currentColor"/></svg></button>
      </div>
      <input id="horizontal-slider" type="range" min="-60" max="60" value="0" step="1" aria-label="水平斜切滑杆" />
      <div id="horizontal-presets" class="axis-presets" aria-label="水平斜切预设">
        <button class="axis-preset-button" type="button" data-axis="horizontal" data-value="-45">−45°</button>
        <button class="axis-preset-button" type="button" data-axis="horizontal" data-value="-30">−30°</button>
        <button class="axis-preset-button" type="button" data-axis="horizontal" data-value="-15">−15°</button>
        <button class="axis-preset-button" type="button" data-axis="horizontal" data-value="15">+15°</button>
        <button class="axis-preset-button" type="button" data-axis="horizontal" data-value="30">+30°</button>
        <button class="axis-preset-button" type="button" data-axis="horizontal" data-value="45">+45°</button>
      </div>
    </div>
    <div class="control">
      <div class="control-top">
        <div class="control-name"><svg class="icon" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="7" y="1" width="10" height="2" transform="rotate(90 7 1)" fill="#A4A4A4"/><path d="M11 8L11 11L9 11L9 6L11 8Z" fill="#A4A4A4"/><path d="M1 4L1 1L3 1L3 6L1 4Z" fill="#A4A4A4"/></svg><label for="vertical-angle">Vertical Skew</label></div>
        <input id="vertical-angle" class="number" type="number" value="0" min="-60" max="60" step="1" aria-label="垂直斜切角度" />
        <span class="degree">°</span>
        <button class="preset-toggle" type="button" aria-label="垂直角度预设" aria-expanded="false" aria-controls="vertical-presets"><svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 3.5L6 7.5L10 3.5" stroke-width="1.5" stroke="currentColor"/></svg></button>
      </div>
      <input id="vertical-slider" type="range" min="-60" max="60" value="0" step="1" aria-label="垂直斜切滑杆" />
      <div id="vertical-presets" class="axis-presets" aria-label="垂直斜切预设">
        <button class="axis-preset-button" type="button" data-axis="vertical" data-value="-45">−45°</button>
        <button class="axis-preset-button" type="button" data-axis="vertical" data-value="-30">−30°</button>
        <button class="axis-preset-button" type="button" data-axis="vertical" data-value="-15">−15°</button>
        <button class="axis-preset-button" type="button" data-axis="vertical" data-value="15">+15°</button>
        <button class="axis-preset-button" type="button" data-axis="vertical" data-value="30">+30°</button>
        <button class="axis-preset-button" type="button" data-axis="vertical" data-value="45">+45°</button>
      </div>
    </div>
    <div class="actions">
      <button id="reset" class="reset" type="button">Reset</button>
      <button id="apply" class="apply" type="button">Apply</button>
    </div>
    <button id="undo" class="undo" type="button">撤销上一步</button>
    <script>
      const horizontalAngleInput = document.getElementById("horizontal-angle");
      const verticalAngleInput = document.getElementById("vertical-angle");
      const horizontalSlider = document.getElementById("horizontal-slider");
      const verticalSlider = document.getElementById("vertical-slider");
      const previewShape = document.getElementById("preview-shape");
      const anchorButtons = Array.from(document.querySelectorAll(".anchor-button"));
      const presetButtons = Array.from(document.querySelectorAll(".axis-preset-button"));
      const presetToggles = Array.from(document.querySelectorAll(".preset-toggle"));

      function closePresetMenus() {
        presetToggles.forEach((toggle) => {
          toggle.setAttribute("aria-expanded", "false");
          toggle.closest(".control").classList.remove("is-open");
        });
      }

      presetToggles.forEach((toggle) => {
        toggle.onclick = () => {
          const wasOpen = toggle.getAttribute("aria-expanded") === "true";
          closePresetMenus();
          if (!wasOpen) {
            toggle.setAttribute("aria-expanded", "true");
            toggle.closest(".control").classList.add("is-open");
          }
        };
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".preset-toggle, .axis-presets")) closePresetMenus();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        const openToggle = presetToggles.find((toggle) => toggle.getAttribute("aria-expanded") === "true");
        closePresetMenus();
        if (openToggle) openToggle.focus();
      });
      document.addEventListener("focusin", (event) => {
        if (!event.target.closest(".preset-toggle, .axis-presets")) closePresetMenus();
      });
      const anchorOrigins = {
        "top-left": "0% 0%",
        "top-center": "50% 0%",
        "top-right": "100% 0%",
        "center-left": "0% 50%",
        center: "50% 50%",
        "center-right": "100% 50%",
        "bottom-left": "0% 100%",
        "bottom-center": "50% 100%",
        "bottom-right": "100% 100%",
      };
      let anchor = "center";

      function clamp(value) {
        return Math.max(-60, Math.min(60, Number.isFinite(value) ? value : 0));
      }

      function updatePreview() {
        const horizontalRadians = (Number(horizontalSlider.value) * Math.PI) / 180;
        const verticalRadians = (Number(verticalSlider.value) * Math.PI) / 180;
        const shapeSize = 58;
        const availableWidth = 192;
        const availableHeight = 106;
        const skewedWidth = shapeSize + Math.abs(Math.tan(horizontalRadians)) * shapeSize;
        const skewedHeight = shapeSize + Math.abs(Math.tan(verticalRadians)) * shapeSize;
        const previewScale = Math.min(1, availableWidth / skewedWidth, availableHeight / skewedHeight);

        previewShape.style.transformOrigin = anchorOrigins[anchor];
        previewShape.style.transform = `scale(${previewScale}) skew(${horizontalSlider.value}deg, ${verticalSlider.value}deg)`;
      }

      function sendPreview() {
        parent.postMessage({
          pluginMessage: {
            type: "preview-skew",
            horizontalAngle: horizontalAngleInput.value,
            verticalAngle: verticalAngleInput.value,
            anchor,
          },
        }, "*");
      }

      function updatePresetState() {
        const horizontalAngle = Number(horizontalAngleInput.value);
        const verticalAngle = Number(verticalAngleInput.value);
        presetButtons.forEach((button) => {
          const axisValue = button.dataset.axis === "horizontal" ? horizontalAngle : verticalAngle;
          const isActive = axisValue === Number(button.dataset.value);
          button.classList.toggle("is-active", isActive);
        });
      }

      function selectAnchor(nextAnchor, shouldPreview = true) {
        anchor = nextAnchor;
        anchorButtons.forEach((button) => {
          button.setAttribute("aria-checked", String(button.dataset.anchor === anchor));
        });
        updatePreview();
        if (shouldPreview) sendPreview();
      }

      function syncControls(input, slider, value, shouldPreview = true) {
        const normalizedValue = clamp(Number(value));
        input.value = normalizedValue;
        slider.value = normalizedValue;
        updatePresetState();
        updatePreview();
        if (!shouldPreview) return;
        sendPreview();
      }

      function applyPreset(axis, value) {
        if (axis === "horizontal") {
          syncControls(horizontalAngleInput, horizontalSlider, value, false);
        } else {
          syncControls(verticalAngleInput, verticalSlider, value, false);
        }
        sendPreview();
      }

      horizontalSlider.oninput = () => syncControls(horizontalAngleInput, horizontalSlider, horizontalSlider.value);
      verticalSlider.oninput = () => syncControls(verticalAngleInput, verticalSlider, verticalSlider.value);
      horizontalAngleInput.oninput = () => syncControls(horizontalAngleInput, horizontalSlider, horizontalAngleInput.value);
      verticalAngleInput.oninput = () => syncControls(verticalAngleInput, verticalSlider, verticalAngleInput.value);
      anchorButtons.forEach((button) => {
        button.onclick = () => selectAnchor(button.dataset.anchor);
      });
      presetButtons.forEach((button) => {
        button.onclick = () => {
          applyPreset(button.dataset.axis, button.dataset.value);
          closePresetMenus();
          presetToggles.find((toggle) => toggle.getAttribute("aria-controls") === button.parentElement.id).focus();
        };
      });

      document.getElementById("apply").onclick = () => {
        parent.postMessage({
          pluginMessage: {
            type: "apply-skew",
            horizontalAngle: horizontalAngleInput.value,
            verticalAngle: verticalAngleInput.value,
            anchor,
          },
        }, "*");
      };

      document.getElementById("undo").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "undo" } }, "*");
      };

      document.getElementById("reset").onclick = () => {
        syncControls(horizontalAngleInput, horizontalSlider, 0, false);
        syncControls(verticalAngleInput, verticalSlider, 0, false);
        selectAnchor("center", false);
        updatePresetState();
        parent.postMessage({ pluginMessage: { type: "reset" } }, "*");
      };

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "clear-status") {
          closePresetMenus();
          return;
        }
      };
    </script>
  </body>
</html>
